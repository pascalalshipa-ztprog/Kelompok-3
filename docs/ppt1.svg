<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Cakupan MVP Sistem Pengaduan Mahasiswa</title>
  <desc id="desc">Perbandingan fitur yang masuk MVP UTS dan fitur yang berada di luar MVP atau direncanakan setelah UTS.</desc>
  <rect width="1200" height="520" rx="24" fill="#f3f6fb"/>
  <text x="54" y="58" fill="#15243a" font-family="Arial, sans-serif" font-size="29" font-weight="700">CAKUPAN MVP • UTS</text>
  <text x="54" y="91" fill="#56677f" font-family="Arial, sans-serif" font-size="16">Sistem Pengaduan Mahasiswa • Kelompok 3</text>
  <g font-family="Arial, sans-serif">
    <rect x="54" y="126" width="530" height="338" rx="18" fill="#ffffff" stroke="#9bcbb0" stroke-width="2"/>
    <rect x="54" y="126" width="530" height="58" rx="18" fill="#e8f6ef"/>
    <path d="M54 166 V184 H584 V166" fill="#e8f6ef"/>
    <text x="82" y="164" fill="#226346" font-size="21" font-weight="700">MASUK MVP</text>
    <g fill="#35465d" font-size="17">
      <circle cx="91" cy="224" r="5" fill="#32845b"/><text x="110" y="230">Daftar dan masuk dengan NIM atau email</text>
      <circle cx="91" cy="273" r="5" fill="#32845b"/><text x="110" y="279">Pengaduan: kategori, judul, deskripsi, lokasi</text>
      <circle cx="91" cy="322" r="5" fill="#32845b"/><text x="110" y="328">Admin: ubah status dan kelola akun</text>
      <circle cx="91" cy="371" r="5" fill="#32845b"/><text x="110" y="377">Rekap pengaduan dalam format CSV</text>
      <circle cx="91" cy="420" r="5" fill="#32845b"/><text x="110" y="426">Endpoint JSON baca-saja</text>
    </g>

    <rect x="616" y="126" width="530" height="338" rx="18" fill="#ffffff" stroke="#e4c992" stroke-width="2"/>
    <rect x="616" y="126" width="530" height="58" rx="18" fill="#fff5e5"/>
    <path d="M616 166 V184 H1146 V166" fill="#fff5e5"/>
    <text x="644" y="164" fill="#8a5a14" font-size="21" font-weight="700">DI LUAR MVP / RENCANA LANJUTAN</text>
    <g fill="#35465d" font-size="16">
      <circle cx="653" cy="224" r="5" fill="#d58a15"/><text x="672" y="230">Reset sandi melalui email nyata (SMTP)</text>
      <circle cx="653" cy="273" r="5" fill="#d58a15"/><text x="672" y="279">Pemulihan dan verifikasi ekspor PDF (DomPDF)</text>
      <circle cx="653" cy="322" r="5" fill="#d58a15"/><text x="672" y="328">API tulis: membuat, mengubah, menghapus</text>
      <circle cx="653" cy="371" r="5" fill="#d58a15"/><text x="672" y="377">Pengujian database MySQL</text>
      <circle cx="653" cy="420" r="5" fill="#d58a15"/><text x="672" y="426">Uji UI lintas perangkat</text>
    </g>
  </g>
  <text x="54" y="492" fill="#56677f" font-family="Arial, sans-serif" font-size="14">API yang tersedia: GET /api/complaints dan memerlukan sesi login.</text>
</svg>
