<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Kebutuhan MUST dan status implementasi</title>
  <desc id="desc">Tujuh kebutuhan fungsional prioritas MUST beserta status selesai menurut presentasi mid-project.</desc>
  <rect width="1200" height="670" rx="24" fill="#f3f6fb"/>
  <text x="52" y="58" fill="#15243a" font-family="Arial, sans-serif" font-size="29" font-weight="700">KEBUTUHAN MUST &amp; STATUS</text>
  <text x="52" y="91" fill="#56677f" font-family="Arial, sans-serif" font-size="16">Status seperti yang ditampilkan pada presentasi UTS / MVP review.</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="125" width="1096" height="420" rx="16" fill="#ffffff" stroke="#c9d7e8" stroke-width="2"/>
    <path d="M52 141 Q52 125 68 125 H1132 Q1148 125 1148 141 V178 H52 Z" fill="#183957"/>
    <text x="78" y="158" fill="#ffffff" font-size="15" font-weight="700">ID</text>
