    <text x="825" y="158" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PRIORITAS</text>
    <text x="1023" y="158" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">STATUS</text>
    <g stroke="#dce4ee" stroke-width="1">
