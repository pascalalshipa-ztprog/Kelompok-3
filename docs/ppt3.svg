      <text x="78" y="263">F-02</text><text x="163" y="263">Mahasiswa membuat pengaduan</text>
      <text x="78" y="315">F-03</text><text x="163" y="315">Mahasiswa mencari dan memantau pengaduan</text>
      <text x="78" y="367">F-04</text><text x="163" y="367">Mengubah/menghapus pengaduan berstatus Menunggu</text>
      <text x="78" y="419">F-05</text><text x="163" y="419">Admin melihat pengaduan dan mengubah status</text>
      <text x="78" y="471">F-06</text><text x="163" y="471">Admin mengelola akun pengguna</text>
      <text x="78" y="523">F-07</text><text x="163" y="523">Admin mengunduh rekap CSV</text>
    </g>
    <g font-size="14" font-weight="700" text-anchor="middle">
      <text x="817" y="211" fill="#174a83">MUST</text><text x="1018" y="211" fill="#238052">SELESAI</text>
      <text x="817" y="263" fill="#174a83">MUST</text><text x="1018" y="263" fill="#238052">SELESAI</text>
      <text x="817" y="315" fill="#174a83">MUST</text><text x="1018" y="315" fill="#238052">SELESAI</text>
      <text x="817" y="367" fill="#174a83">MUST</text><text x="1018" y="367" fill="#238052">SELESAI</text>
      <text x="817" y="419" fill="#174a83">MUST</text><text x="1018" y="419" fill="#238052">SELESAI</text>
      <text x="817" y="471" fill="#174a83">MUST</text><text x="1018" y="471" fill="#238052">SELESAI</text>
      <text x="817" y="523" fill="#174a83">MUST</text><text x="1018" y="523" fill="#238052">SELESAI</text>
