<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Arsitektur dan tech stack aplikasi</title>
  <desc id="desc">Alur request dari browser melalui route, autentikasi, controller, model, database, lalu respons Blade atau JSON, beserta teknologi proyek.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#55718f"/></marker></defs>
  <rect width="1200" height="590" rx="24" fill="#f3f6fb"/>
  <text x="52" y="58" fill="#15243a" font-family="Arial, sans-serif" font-size="29" font-weight="700">ARSITEKTUR &amp; TECH STACK</text>
  <text x="52" y="91" fill="#56677f" font-family="Arial, sans-serif" font-size="16">Alur request MVC yang digunakan aplikasi.</text>
  <g font-family="Arial, sans-serif">
    <rect x="52" y="130" width="205" height="100" rx="15" fill="#e8f2ff" stroke="#9bbce5" stroke-width="2"/>
