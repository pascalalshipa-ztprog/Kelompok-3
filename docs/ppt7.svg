  <title id="title">Milestone M1 sampai M3 dan alur kerja tim</title>
  <desc id="desc">M1 Idea and Design pada pertemuan 1 sampai 2, M2 Basic Build pada pertemuan 3 sampai 5, M3 MVP pada pertemuan 6 sampai 8, serta alur branch, pull request, review, dan merge.</desc>
