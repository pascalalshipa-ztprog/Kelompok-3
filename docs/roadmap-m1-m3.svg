    <text x="832" y="279" fill="#15243a" font-size="21" font-weight="700">4–12 November</text>
    <text x="832" y="319" fill="#35465d" font-size="16">• UI responsif dan API baca-saja</text>
    <text x="832" y="349" fill="#35465d" font-size="16">• Tes dan dokumentasi proyek</text>
